name: Verify

# Workflow reutilizável: é o gate único do projeto. Roda em CI, no release e
# pode ser chamado manualmente a partir de outro workflow. Não publica nada.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: npm run manifest

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Build and package (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Write checksum
        run: sha256sum ./*.tgz > checksums.sha256

      - name: Upload distributable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spresenter-pulse-fx-pkg
          path: |
            ./*.tgz
            ./checksums.sha256
          if-no-files-found: error
          retention-days: 14
